name: Build & Archive Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 用于把产物 commit 回仓库的 releases/ 目录

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK (signed by内置 keystore)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Get version name
        id: ver
        run: |
          v=$(grep versionName app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Prepare archive dir
        run: |
          mkdir -p releases
          # 清空历史 APK，仅保留本次构建的版本（避免无限膨胀仓库）
          find releases -name '*.apk' -delete
          cp app/build/outputs/apk/release/app-release.apk \
             "releases/SpeedPing-v${{ steps.ver.outputs.name }}-b${GITHUB_RUN_ID}.apk"
          ls -la releases

      - name: Commit archive to repo
        run: |
          git config user.name "wochatchat"
          git config user.email "277640203+wochatchat@users.noreply.github.com"
          git add releases/
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "release(archive): SpeedPing v${{ steps.ver.outputs.name }} build ${GITHUB_RUN_ID} [skip ci]"
            git push
          fi

      - name: Upload APK to workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedPing-apk
          path: releases/*.apk
          if-no-files-found: error
          retention-days: 30
